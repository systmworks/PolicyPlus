name: Build Latest

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write # needed to publish the "latest" release below

jobs:
  BuildLatest:
    runs-on: windows-2022

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Embed version
        run: |
          cd $env:GITHUB_WORKSPACE
          cmd /c version.bat

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compile
        run: dotnet build $env:GITHUB_WORKSPACE\PolicyPlus\PolicyPlus.sln -c Release

      - name: Run tests
        run: dotnet test $env:GITHUB_WORKSPACE\PolicyPlus\PolicyPlus.Tests\PolicyPlus.Tests.csproj -c Release --no-build

      - name: Compute hash
        run: Get-FileHash "$env:GITHUB_WORKSPACE\PolicyPlus\bin\Release\net10.0-windows\Policy Plus.exe"

      - name: Stage compiled output
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\Compiled"
          Copy-Item "$env:GITHUB_WORKSPACE\PolicyPlus\bin\Release\net10.0-windows\*" -Destination "$env:GITHUB_WORKSPACE\Compiled" -Recurse

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Policy Plus (Windows)
          path: Compiled/

      - name: Publish self-contained single-file EXE
        run: dotnet publish $env:GITHUB_WORKSPACE\PolicyPlus\PolicyPlus.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o $env:GITHUB_WORKSPACE\publish

      - name: Strip everything except the EXE
        run: Get-ChildItem "$env:GITHUB_WORKSPACE\publish" -Exclude "*.exe" | Remove-Item -Force

      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (${{ github.sha }})
          body: >
            Automated build from the latest commit on master (${{ github.sha }}).
            Single self-contained EXE - no .NET runtime install required, just download
            and run. This release is overwritten on every push to master.
          files: publish/Policy Plus.exe
